name: docs-preview-cleanup

# The default-branch workflow reads only the numeric PR from the event. It
# checks out the cleanup script of the base branch and no pull request content,
# so nothing a pull request adds runs with the cleanup role.
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: docs-deploy-${{ github.repository }}
  queue: max

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: docs-preview-cleanup
    env:
      # The tracking toolchain, which is the selectors of .tool-versions; the
      # workflow check holds these two lines to it.
      TRACKING_OTP: '29'
      TRACKING_ELIXIR: '1.20'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/docs_preview_cleanup
          persist-credentials: false

      # The script needs Elixir 1.18 or newer for its JSON module. Any selector
      # the workflow check holds to .tool-versions serves.
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.TRACKING_OTP }}
          elixir-version: ${{ env.TRACKING_ELIXIR }}
          version-type: loose
          install-hex: false
          install-rebar: false

      # Closed events can be rerun after a PR reopens. Read current state
      # before assuming the cleanup role or deleting any object.
      - id: current
        name: Check current cleanup eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: >-
          elixir scripts/docs_preview_cleanup/docs_preview_cleanup.exs
          eligibility
          --repository "$REPOSITORY"
          --pr "$PR"
          --github-output "$GITHUB_OUTPUT"

      - if: steps.current.outputs.should_cleanup == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.LIBTMUX_DOCS_PREVIEW_CLEANUP_ROLE_ARN }}
          aws-region: us-east-1

      - name: Delete this Elixir preview
        if: steps.current.outputs.should_cleanup == 'true'
        env:
          BUCKET: ${{ secrets.LIBTMUX_DOCS_BUCKET }}
          PR: ${{ github.event.pull_request.number }}
        run: >-
          elixir scripts/docs_preview_cleanup/docs_preview_cleanup.exs
          delete
          --bucket "$BUCKET"
          --pr "$PR"
