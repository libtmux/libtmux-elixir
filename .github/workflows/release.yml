name: Publish core

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: hex-publish
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/scaffold.yml
    with:
      scope: full

  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: hex
    permissions:
      contents: read
      id-token: write
    env:
      MIX_ENV: dev
      DOCS_SOURCE_REF: ${{ github.sha }}
      # The tracking toolchain, which is the selectors of .tool-versions; the
      # workflow check holds these two lines to it.
      TRACKING_OTP: '29'
      TRACKING_ELIXIR: '1.20'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.TRACKING_OTP }}
          elixir-version: ${{ env.TRACKING_ELIXIR }}
          version-type: loose
          install-hex: true
          install-rebar: false
      - name: Verify runtime and compiled OTP identity
        run: time elixir scripts/check_runtime/check_runtime.exs tracking
      - name: Validate release metadata
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: elixir scripts/check_release/check_release.exs "$RELEASE_TAG"
      - name: Install development documentation tools
        run: mix deps.get
      - name: Build the release archive without publishing
        run: mix hex.build --output "${RUNNER_TEMP}/libtmux.tar"
      - name: Render release documentation
        run: mix docs --warnings-as-errors
      - name: Check rendered documentation links
        run: elixir scripts/check_docs_links/check_docs_links.exs
      - name: Publish core and documentation to Hex
        timeout-minutes: 10
        run: mix hex.publish --yes --wait
      - name: Wait for the documentation
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          elixir scripts/wait_for_hexdocs/wait_for_hexdocs.exs
          "https://hexdocs.pm/libtmux/$RELEASE_VERSION/"
      - name: Install and execute the public core outside the checkout
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: elixir scripts/check_hex_install.exs "$RELEASE_VERSION"
