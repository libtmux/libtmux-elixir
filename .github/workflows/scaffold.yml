name: Scaffold

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scaffold-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    name: Mix metadata and package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
          install-hex: true
          install-rebar: false
      - name: Check formatting
        run: time mix format --check-formatted
      - name: Compile application metadata
        run: time mix compile --warnings-as-errors
      - name: Build local package
        run: time mix hex.build --output "${RUNNER_TEMP}/libtmux.tar"
      - name: List packaged files
        run: tar -xOf "${RUNNER_TEMP}/libtmux.tar" contents.tar.gz | tar -tzf -
