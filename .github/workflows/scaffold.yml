name: Core checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: >-
          edges runs the oldest and newest required tmux, full runs every
          required tmux, custom runs the refs in tmux-ref. A release is bound
          to a full run.
        type: choice
        options: [edges, full, custom]
        default: edges
      tmux-ref:
        description: >-
          With scope custom, comma-separated tmux versions, tags, branches or
          40-hex commit SHAs from github.com/tmux/tmux, such as 3.6b,master.
        type: string
        default: ''
      elixir:
        description: >-
          Comma-separated Elixir versions for the native cells, such as
          1.19.5. Empty means the reference and tracking pairs.
        type: string
        default: ''
      otp:
        description: >-
          Comma-separated OTP versions for the native cells, such as 28.3.
          Empty means the reference and tracking pairs.
        type: string
        default: ''
      os:
        description: Runner image for the native cells
        type: choice
        options: [ubuntu-24.04, ubuntu-latest, ubuntu-22.04]
        default: ubuntu-24.04
      tmate:
        description: >-
          Open a tmate session on the one native cell, before the tests or
          after a failure. It needs scope custom with a single tmux-ref,
          elixir and otp.
        type: choice
        options: ['off', before-tests, on-failure]
        default: 'off'
  workflow_call:
    inputs:
      scope:
        description: How much of the table to cover. Publish passes full.
        required: true
        type: string

permissions:
  contents: read

env:
  # The tracking toolchain, which is the selectors of .tool-versions. The jobs
  # that install it cannot read the file before Elixir exists; the workflow
  # check holds these two lines to it.
  TRACKING_OTP: '29'
  TRACKING_ELIXIR: '1.20'

concurrency:
  group: scaffold-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    name: Core units and package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.TRACKING_OTP }}
          elixir-version: ${{ env.TRACKING_ELIXIR }}
          version-type: loose
          install-hex: true
          install-rebar: false
      - name: Validate release metadata for version tags
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: elixir scripts/check_release/check_release.exs "$RELEASE_TAG"
      - name: Install development documentation tools
        run: mix deps.get
      - name: Check formatting
        run: time mix format --check-formatted
      - name: Check executable documentation drift
        run: time elixir scripts/check_example_docs/check_example_docs.exs
      - name: Test the documentation drift check
        run: time elixir scripts/check_example_docs/tests/check_example_docs_test.exs
      - name: Check publication readiness handling
        run: time elixir scripts/wait_for_hexdocs/tests/wait_for_hexdocs_test.exs
      - name: Test the CI plan
        run: time elixir scripts/ci_plan/tests/ci_plan_test.exs
      - name: Check that the workflows follow the plan
        run: time elixir scripts/ci_plan/tests/ci_workflow_test.exs
      - name: Check that the documents agree with the support manifest
        run: time elixir scripts/ci_plan/tests/ci_docs_test.exs
      - name: Test the release check
        run: time elixir scripts/check_release/tests/check_release_test.exs
      - name: Test the runtime check
        run: time elixir scripts/check_runtime/tests/check_runtime_test.exs
      - name: Compile core
        run: time mix compile --warnings-as-errors
      - name: Check generated schema reference
        run: time mix run scripts/generate_schema.exs --check
      - name: Run pure units
        run: time mix test
      - name: Check public specs and typedocs
        run: time mix run scripts/check_public_contracts.exs
      - name: Check consumer type diagnostics
        run: time mix run scripts/check_consumer_types.exs
      - name: Render native documentation
        env:
          DOCS_SOURCE_REF: ${{ github.sha }}
        run: time mix docs --warnings-as-errors
      - name: Check rendered documentation links
        run: time elixir scripts/check_docs_links/check_docs_links.exs
      - name: Test the documentation link check
        run: time elixir scripts/check_docs_links/tests/check_docs_links_test.exs
      - name: Build local package
        run: time mix hex.build --output "${RUNNER_TEMP}/libtmux.tar"
      - name: List packaged files
        run: tar -xOf "${RUNNER_TEMP}/libtmux.tar" contents.tar.gz | tar -tzf -
      - name: Consume packed core outside checkout
        run: time mix run scripts/check_package.exs

  # What a run covers is decided here from priv/tmux/support.json and the
  # event, so no job below lists a version. A push and a pull request test the
  # oldest and newest required tmux; a release and a dispatch with scope full
  # test every required tmux.
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      os: ${{ steps.plan.outputs.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            priv
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.TRACKING_OTP }}
          elixir-version: ${{ env.TRACKING_ELIXIR }}
          version-type: loose
          install-hex: false
          install-rebar: false
      - name: Plan the run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ inputs.scope }}
          TMUX_REF: ${{ inputs.tmux-ref }}
          ELIXIR: ${{ inputs.elixir }}
          OTP: ${{ inputs.otp }}
          IMAGE: ${{ inputs.os }}
          TMATE: ${{ inputs.tmate }}
        run: |
          elixir scripts/ci_plan/ci_plan.exs plan \
            --event "$EVENT" \
            --scope "$SCOPE" \
            --tmux-ref "$TMUX_REF" \
            --elixir "$ELIXIR" \
            --otp "$OTP" \
            --os "$IMAGE" \
            --tmate "$TMATE" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

  native:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ needs.plan.outputs.os }}
    # A tmate session needs longer than a test run does.
    timeout-minutes: ${{ matrix.tmate == 'off' && 5 || 60 }}
    strategy:
      fail-fast: false
      # The plan chooses the cells and never leaves this empty.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      MIX_ENV: test
      ERL_FLAGS: +S 2:2
      TOOLCHAIN_PROFILE: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
          version-type: loose
          install-hex: true
          install-rebar: false
      - name: Verify runtime and compiled OTP identity
        run: time elixir scripts/check_runtime/check_runtime.exs "$TOOLCHAIN_PROFILE"
      - name: Build tmux
        id: tmux
        uses: libtmux/.github/actions/build-tmux@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          ref: ${{ matrix.ref }}
      - name: Name the tmux binary
        env:
          TMUX_BINARY: ${{ steps.tmux.outputs.binary }}
        run: echo "LIBTMUX_TMUX=$TMUX_BINARY" >> "$GITHUB_ENV"
      - name: Open a tmate session before the tests
        if: ${{ github.event_name == 'workflow_dispatch' && matrix.tmate == 'before-tests' }}
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        timeout-minutes: 30
        with:
          limit-access-to-actor: true
      - name: Compile native test application
        run: time mix compile --warnings-as-errors
      - name: Run pure and owned native cases
        run: time mix test --include integration --warnings-as-errors --max-cases 2 --seed 624498
      - name: Run packed README and guide examples
        run: time mix run scripts/check_package.exs --examples
      - name: Open a tmate session after a failure
        if: ${{ failure() && github.event_name == 'workflow_dispatch' && matrix.tmate == 'on-failure' }}
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        timeout-minutes: 30
        with:
          limit-access-to-actor: true

  required-linux:
    name: Required Linux checks
    needs: [plan, scaffold, native]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PLAN_RESULT: ${{ needs.plan.result }}
      CORE_RESULT: ${{ needs.scaffold.result }}
      NATIVE_RESULT: ${{ needs.native.result }}
    steps:
      - name: Require every core and native cell
        run: |
          test "$PLAN_RESULT" = success
          test "$CORE_RESULT" = success
          test "$NATIVE_RESULT" = success
